name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, tsc, lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-node${{ matrix.node }}-

      - name: Install
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc:full

      - name: Lint
        run: yarn lint:all

      - name: Prettier
        run: yarn prettier:check

      - name: Test
        run: yarn test:all

      - name: Build
        run: yarn build:all

  docker:
    name: Docker image + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: backstage-idp-lab:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: docker compose up (Postgres + Backstage)
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 300

      - name: Smoke test
        run: |
          curl -fsS http://localhost:7007/.backstage/health/v1/readiness
          TOKEN=$(curl -fsS -H 'X-Requested-With: XMLHttpRequest' \
            http://localhost:7007/api/auth/guest/refresh | jq -r .backstageIdentity.token)
          # Catalog ingestion is asynchronous: poll until the sample data is processed.
          for i in $(seq 1 30); do
            COUNT=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
              "http://localhost:7007/api/catalog/entities/by-query?filter=kind=component&limit=100" | jq '.items | length')
            echo "attempt $i: $COUNT components in catalog"
            [ "$COUNT" -ge 5 ] && break
            sleep 5
          done
          [ "$COUNT" -ge 5 ]

          # Stage 2: code-quality plugin answers from mock providers offline
          REPORT=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
            "http://localhost:7007/api/code-quality/report?entityRef=component:default/claims-api")
          echo "$REPORT" | jq -c '{sonarqube: .sonarqube.status, github: .github.status, source: .sonarqube.source}'
          test "$(echo "$REPORT" | jq -r .sonarqube.status)" = ok
          test "$(echo "$REPORT" | jq -r .github.status)" = ok
          # Unauthenticated calls are rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:7007/api/code-quality/report?entityRef=component:default/claims-api")" = 401

          # Stage 3: golden path rejects an invalid request and completes a valid one (offline)
          TOKEN="$TOKEN" scripts/smoke-scaffolder.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
