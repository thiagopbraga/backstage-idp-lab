# Local lab: PostgreSQL + Backstage (multi-stage image built from ./Dockerfile).
#   cp .env.example .env && docker compose up --build
#   open http://localhost:7007
name: backstage-idp-lab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed only on loopback, handy for psql / inspecting catalog tables.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 5s
      retries: 10

  backstage:
    build:
      context: .
      dockerfile: Dockerfile
    image: backstage-idp-lab:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Optional integration tokens (e.g. GITHUB_TOKEN) come from .env only when
    # actually defined there. Never forward them as empty strings: Backstage
    # rejects empty config values and the backend would refuse to start.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network Postgres is reachable by service name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Frontend is served by the backend (app-backend) on the same origin.
      BACKEND_BASE_URL: http://localhost:7007
      BACKSTAGE_GUEST_USER: ${BACKSTAGE_GUEST_USER:-user:default/ana.souza}
    command:
      - node
      - packages/backend
      - --config
      - app-config.yaml
      - --config
      - app-config.production.yaml
      - --config
      - app-config.docker.yaml
    ports:
      - '7007:7007'

volumes:
  pgdata:
